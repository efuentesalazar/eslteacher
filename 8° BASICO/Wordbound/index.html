<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Wordbound — An English RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1d12;--paper:#fbf1dc;--paper2:#f1e0bd;--edge:#b98a4a;--gold:#ffc23d;--gold2:#e09a1a;--hp:#e2453a;--xp:#4fb8ff;--ok:#2ea64f;--bad:#d9433b;--main:#ffc23d;--side:#45b8ff;--shadow:0 5px 0 rgba(30,18,8,.4)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#140d22;font-family:Nunito,system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none}
canvas{display:block}
#c{position:fixed;inset:0;width:100%;height:100%}
.hidden{display:none!important}
h1,h2,h3,.title{font-family:Cinzel,serif}
.btn{border:0;border-radius:12px;padding:10px 18px;font-size:16px;font-weight:900;cursor:pointer;background:linear-gradient(#ffd468,#f0a920);color:var(--ink);box-shadow:var(--shadow);font-family:Nunito,sans-serif;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(30,18,8,.4)}
.btn.alt{background:linear-gradient(#fff8ea,#eadcbf)}.btn.blue{background:linear-gradient(#7cd0ff,#2f8fe0);color:#fff}.btn.red{background:linear-gradient(#ff8a7a,#d9433b);color:#fff}.btn.green{background:linear-gradient(#7ee08a,#2ea64f);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.small{font-size:13px;opacity:.8}
/* loading + menu */
#loading{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#3d2a63,#140d22);color:#fff;z-index:60;text-align:center}
#loading h1{font-size:54px;margin:0;color:#ffd468;text-shadow:0 4px 0 #6b3a10}
#loading .bar{width:min(340px,72vw);height:14px;border-radius:9px;background:#ffffff22;overflow:hidden;margin:16px auto 0}
#loading .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd468,#ff8a3d,#c06bff)}
#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;padding:20px 4vw;background:linear-gradient(90deg,rgba(20,13,34,.9),rgba(20,13,34,.35) 55%,transparent);overflow:auto}
#menu .wrap{max-width:470px;width:100%}
#menu h1{margin:0;font-size:52px;line-height:1;color:#ffd468;text-shadow:0 4px 0 #6b3a10,0 8px 18px rgba(0,0,0,.5)}
#menu .sub{color:#ffe7c2;font-weight:800;margin:6px 0 14px}
.panel{background:var(--paper);border-radius:18px;padding:18px 20px;box-shadow:0 8px 0 rgba(0,0,0,.3);border:3px solid var(--edge)}
.panel label{font-weight:900;font-size:14px;display:block;margin:8px 0 5px}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pick.five{grid-template-columns:repeat(5,1fr)}
.pick button{border:3px solid transparent;border-radius:10px;background:var(--paper2);padding:7px 2px;font-weight:900;font-family:inherit;cursor:pointer;font-size:13px;color:var(--ink)}
.pick button.on{border-color:var(--gold2);background:#ffe6a8}
.pick button span{display:block;font-size:20px}
input[type=text]{width:100%;padding:9px 12px;border-radius:10px;border:2px solid #d9c7a8;font-size:17px;font-family:inherit;background:#fff}
#esltStatus{margin-top:10px;padding:8px 10px;border-radius:10px;background:rgba(88,204,2,.15);font-size:13px}
#esltStatus.warn{background:rgba(255,200,0,.25)}#esltStatus a{color:inherit;font-weight:900}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#card{position:absolute;left:12px;top:12px;background:rgba(251,241,220,.95);border:3px solid var(--edge);border-radius:14px;padding:8px 12px;width:250px;box-shadow:var(--shadow)}
#card .top{display:flex;justify-content:space-between;font-weight:900;font-size:15px}
.bar2{height:12px;border-radius:7px;background:#00000022;overflow:hidden;margin-top:4px;position:relative}
.bar2 i{display:block;height:100%;transition:width .25s}
.bar2 b{position:absolute;inset:0;font-size:10px;line-height:12px;text-align:center;color:#fff;text-shadow:0 1px 1px #000}
#hpb i{background:linear-gradient(90deg,#ff6b5a,var(--hp))}#xpb i{background:linear-gradient(90deg,#8adfff,var(--xp))}
#track{position:absolute;left:12px;top:104px;background:rgba(251,241,220,.95);border:3px solid var(--edge);border-radius:14px;padding:8px 12px;width:min(340px,58vw);box-shadow:var(--shadow);pointer-events:auto}
#track .qt{font-family:Cinzel;font-weight:900;font-size:14px}
#track .qt.main{color:#a86a00}#track .qt.side{color:#1a7ac0}
#track .od{font-weight:700;font-size:14px;line-height:1.3;margin-top:2px}
#track .btn{font-size:12px;padding:5px 10px;margin-top:6px}
#mini{position:absolute;right:12px;top:12px;width:170px;height:170px;border-radius:50%;box-shadow:var(--shadow);border:4px solid var(--edge);pointer-events:auto;cursor:pointer;background:#3fb3e8}
#realmName{position:absolute;right:12px;top:188px;width:170px;text-align:center;color:#fff;font-weight:900;text-shadow:0 2px 3px #000;font-size:14px}
#arrow{position:absolute;left:50%;top:66px;width:44px;height:44px;margin-left:-22px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
#prompt{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(42,29,18,.92);color:#fff;padding:9px 16px;border-radius:12px;font-weight:900;font-size:17px;pointer-events:auto;cursor:pointer;white-space:nowrap}
#prompt kbd{background:var(--gold);color:var(--ink);border-radius:6px;padding:1px 8px;margin-right:6px;font-family:inherit}
#toast{position:absolute;left:50%;top:20%;transform:translateX(-50%);font-family:Cinzel;font-weight:900;font-size:30px;color:#fff;text-shadow:0 3px 0 #6b3a10,0 6px 12px rgba(0,0,0,.5);text-align:center;opacity:0;transition:opacity .3s;width:90vw}
#banner{position:absolute;left:50%;top:30%;transform:translateX(-50%);text-align:center;color:#fff;opacity:0;transition:opacity .8s;text-shadow:0 3px 8px rgba(0,0,0,.7)}
#banner h2{font-size:52px;margin:0;color:#ffe7a8}#banner div{font-weight:900;font-size:20px}
#btns{position:absolute;right:12px;bottom:12px;display:flex;gap:8px;pointer-events:auto}
#btns .btn{padding:8px 12px;font-size:14px}
#potBtn{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);pointer-events:auto}
#help{position:absolute;left:12px;bottom:12px;color:#fff;font-weight:700;font-size:12px;text-shadow:0 1px 2px #000;opacity:.85;max-width:52vw}
#log{position:absolute;left:12px;bottom:40px;display:flex;flex-direction:column;gap:3px;font-weight:800;font-size:14px;color:#fff;text-shadow:0 1px 2px #000}
#onl{position:absolute;right:12px;top:208px;width:170px;text-align:center;background:rgba(42,29,18,.75);color:#ddd;border-radius:10px;padding:4px 6px;font-weight:900;font-size:13px;pointer-events:auto;cursor:pointer}#onl.on{background:rgba(31,143,90,.9);color:#fff}
#chatBtn{position:absolute;left:calc(50% + 90px);bottom:14px;pointer-events:auto;padding:8px 12px;font-size:14px}
#phr{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:6px;pointer-events:auto;background:rgba(251,241,220,.95);border:3px solid var(--edge);border-radius:14px;padding:8px}#phr .btn{font-size:14px;padding:7px 10px;text-align:left}#phr kbd{background:var(--paper2);border-radius:5px;padding:0 5px;margin-right:4px;font-family:inherit}
#bossbar{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(460px,50vw);text-align:center;color:#fff;font-family:Cinzel;font-weight:900;text-shadow:0 2px 3px #000}
#bossbar .bar2{height:16px;border:2px solid #000}#bossbar i{background:linear-gradient(90deg,#b05cff,#6a1fd0)}
/* dialogue */
#dlg{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(900px,96vw);background:var(--paper);border:4px solid var(--edge);border-radius:20px;box-shadow:0 10px 0 rgba(0,0,0,.35);padding:14px 18px;z-index:25;display:flex;gap:14px}
#dlg .face{flex:0 0 70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:34px;color:#fff;font-family:Cinzel;font-weight:900;box-shadow:var(--shadow);border:3px solid #fff}
#dlg .body{flex:1;min-width:0}
#dlg .who{font-family:Cinzel;font-weight:900;font-size:18px;display:flex;align-items:center;gap:8px}
#dlg .who .qtag{font-family:Nunito;font-size:12px;background:#00000014;padding:2px 8px;border-radius:9px}
#dlg .txt{font-size:20px;line-height:1.45;margin:4px 0 8px;font-weight:600;min-height:30px}
#dlg .txt.listen{color:#7a5a3a;font-style:italic}
#dlg .q{font-weight:900;font-size:16px;margin-bottom:6px;color:#7a4a10}
#dlg .opts{display:grid;gap:6px}
#dlg .opt{text-align:left;border:2px solid #e2d2b6;background:#fff;border-radius:12px;padding:9px 13px;font-size:17px;font-family:inherit;font-weight:800;cursor:pointer;color:var(--ink)}
#dlg .opt:hover{border-color:var(--gold2);background:#fffaf0}
#dlg .opt.ok{background:#d9f5df;border-color:var(--ok)}#dlg .opt.no{background:#fbdcd9;border-color:var(--bad);text-decoration:line-through;opacity:.6}
#dlg .opt kbd{background:var(--paper2);border-radius:5px;padding:0 6px;margin-right:6px;font-family:inherit}
#dlg .row{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
#dlg .row .sp{flex:1}
#dlg .tool{border:0;background:var(--paper2);border-radius:10px;padding:6px 10px;font-weight:900;cursor:pointer;font-family:inherit;font-size:14px}
.g{border-bottom:2px dotted #b07a2a;cursor:help}
#gpop{position:fixed;z-index:80;background:#2a1d12;color:#fff;padding:6px 10px;border-radius:9px;font-weight:800;font-size:15px;pointer-events:none;box-shadow:0 4px 10px rgba(0,0,0,.4)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,12,30,.55);display:grid;place-items:center;z-index:30;padding:12px}
#mbox{background:var(--paper);border:4px solid var(--edge);border-radius:20px;width:min(1020px,100%);max-height:94vh;overflow:auto;box-shadow:0 12px 0 rgba(0,0,0,.35);padding:18px 22px;position:relative}
#mbox h2{margin:0 0 8px;font-size:26px}
#mbox .x{position:absolute;right:12px;top:10px;font-size:22px;padding:4px 12px}
.doc{background:#fffaf0 url();border:2px solid #e2cfa8;border-radius:12px;padding:16px 22px;font-size:19px;line-height:1.6;font-family:Georgia,serif;max-height:62vh;overflow:auto}
.doc p{margin:0 0 10px}
.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
/* inventory */
.inv{display:grid;grid-template-columns:320px 1fr;gap:18px}
.doll{position:relative;background:radial-gradient(circle at 50% 40%,#fff6df,#e8d3a8);border:2px solid #d8bf8f;border-radius:16px;height:430px}
.doll canvas{width:100%;height:100%;border-radius:14px;cursor:grab}
.slot{position:absolute;width:62px;height:62px;border-radius:12px;background:rgba(255,255,255,.85);border:2px dashed #c9a46a;display:grid;place-items:center;font-size:26px;cursor:pointer;overflow:hidden}
.slot.full{border-style:solid;border-color:var(--gold2);background:#fff}
.slot small{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:9px;font-weight:900;opacity:.7}
.slot img,.cell img{width:100%;height:100%;object-fit:contain}
.stats{display:flex;gap:8px;justify-content:center;margin-top:8px;font-weight:900;flex-wrap:wrap}
.stats span{background:var(--paper2);border-radius:9px;padding:4px 9px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px;align-content:start}
.cell{position:relative;aspect-ratio:1;border-radius:12px;background:#fff;border:2px solid #e2d2b6;display:grid;place-items:center;font-size:30px;cursor:pointer;overflow:hidden}
.cell.sel{border-color:var(--gold2);box-shadow:0 0 0 3px #ffd46888}
.cell.q{background:#fff3c8}.cell i.up,.slot i.up{position:absolute;left:4px;top:2px;font-style:normal;font-size:12px;font-weight:900;color:#fff;background:#6a3fd0;border-radius:7px;padding:0 5px}.cell b{position:absolute;right:4px;bottom:1px;font-size:13px;font-weight:900;color:#5a3a10}
.cell.empty{background:#00000008;border-style:dashed;cursor:default}
.detail{margin-top:12px;background:#fff;border:2px solid #e2d2b6;border-radius:12px;padding:10px 14px;min-height:96px}
.detail h3{margin:0;font-size:19px}.detail .tags{font-size:13px;font-weight:800;color:#7a5a3a;margin:2px 0 4px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border:0;border-radius:10px;padding:7px 14px;font-weight:900;cursor:pointer;background:var(--paper2);font-family:inherit;font-size:15px}
.tabs button.on{background:var(--gold)}
.qlist{display:grid;grid-template-columns:260px 1fr;gap:14px}
.qitem{padding:8px 10px;border-radius:10px;background:#fff;border:2px solid #e2d2b6;margin-bottom:6px;cursor:pointer;font-weight:800;font-size:14px}
.qitem.on{border-color:var(--gold2)}.qitem.done{opacity:.55}
.qitem .m{color:#a86a00}.qitem .s{color:#1a7ac0}
.phr{background:#fff;border:2px solid #e2d2b6;border-radius:10px;padding:8px 12px;margin-bottom:6px;font-weight:700}
.phr small{display:block;opacity:.65;font-weight:800}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.srow{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #e2d2b6;border-radius:12px;padding:6px 10px;margin-bottom:6px}
.srow .ic{width:46px;height:46px;display:grid;place-items:center;font-size:28px}.srow .ic img{width:100%;height:100%;object-fit:contain}
.srow .nm{flex:1;font-weight:800;font-size:14px}.srow .nm small{display:block;font-weight:700;opacity:.7}
.srow .btn{padding:6px 10px;font-size:13px}
#bigmap{width:min(72vh,88vw);height:min(72vh,88vw);display:block;margin:0 auto;border-radius:16px;border:3px solid var(--edge)}
/* touch */
#touch{position:fixed;inset:0;pointer-events:none;z-index:6}
#stick{position:absolute;left:22px;bottom:22px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.4);pointer-events:auto}
#stick i{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.75)}
#tbtns{position:absolute;right:18px;bottom:70px;display:grid;grid-template-columns:repeat(2,70px);gap:10px;pointer-events:auto}
#tbtns .btn{width:70px;height:70px;border-radius:50%;padding:0;font-size:13px}
@media (max-width:820px),(max-height:560px){
 #card{width:190px;padding:6px 9px;left:8px;top:8px}#card .top{font-size:13px}
 #track{top:86px;left:8px;padding:6px 9px}#track .od{font-size:12px}#track .qt{font-size:12px}
 #mini{width:110px;height:110px;top:8px;right:8px}#realmName{top:120px;width:110px;right:8px;font-size:11px}
 #dlg{padding:8px 10px;gap:8px;bottom:6px}#dlg .face{flex-basis:44px;height:44px;font-size:22px}#dlg .txt{font-size:15px}#dlg .opt{font-size:14px;padding:6px 9px}#dlg .q{font-size:13px}
 .inv{grid-template-columns:1fr}.doll{height:300px}.qlist,.shop{grid-template-columns:1fr}
 #help{display:none}#prompt{bottom:12px;font-size:14px}#btns{bottom:auto;top:150px;right:8px;flex-direction:column}#potBtn{bottom:auto;top:8px}
 #banner h2{font-size:32px}#toast{font-size:20px}#onl{top:136px;width:110px;right:8px;font-size:10px}#chatBtn{left:auto;right:8px;bottom:auto;top:330px}#phr{grid-template-columns:1fr 1fr;bottom:8px}
}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../../assets/js/eslt-fullscreen.js" defer></script>
</head>
<body>
<canvas id="c"></canvas>

<div id="loading"><div><h1>Wordbound</h1><div style="font-weight:800">Building the five realms…</div><div class="bar"><i id="lbar"></i></div></div></div>

<div id="menu" class="hidden"><div class="wrap">
 <h1>Wordbound</h1>
 <div class="sub">An English adventure · Bring back the Crown of Words</div>
 <div class="panel">
  <label>Your people</label>
  <div class="pick" id="races"></div>
  <label>Your style</label>
  <div class="pick five" id="looks"></div>
  <label for="pname">Your name</label>
  <input type="text" id="pname" maxlength="14" placeholder="e.g. Sofía" autocomplete="off">
  <div id="esltStatus"></div>
  <div style="display:flex;gap:10px;margin-top:12px">
   <button class="btn" id="bPlay" style="flex:1;font-size:19px">▶ Play</button>
   <button class="btn alt" id="bOpt">⚙️</button>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
   <span class="small" id="progressTxt"></span>
   <span><button class="btn alt" style="font-size:12px;padding:5px 9px" id="bCred">Credits</button> <button class="btn alt" style="font-size:12px;padding:5px 9px" id="bReset">New game</button></span>
  </div>
 </div>
</div></div>

<div id="hud" class="hidden">
 <div id="card"><div class="top"><span id="cName">Hero</span><span id="cLv">Lv 1</span></div>
  <div class="bar2" id="hpb"><i></i><b></b></div><div class="bar2" id="xpb"><i></i><b></b></div>
  <div class="top" style="font-size:13px;margin-top:4px"><span id="cGold">🪙 0</span><span id="cStats">⚔️ 0 · 🛡️ 0</span></div></div>
 <div id="track"></div>
 <canvas id="mini" width="420" height="420" title="Map (M)"></canvas>
 <div id="realmName"></div>
 <div id="onl" title="Online world">🌐 Offline</div>
 <div id="phr" class="hidden"></div>
 <button class="btn blue hidden" id="chatBtn">💬 Say (T)</button>
 <svg id="arrow" viewBox="0 0 40 40"><path d="M20 3 L35 34 L20 26 L5 34 Z" fill="#ffc23d" stroke="#2a1d12" stroke-width="3" stroke-linejoin="round"/></svg>
 <div id="bossbar" class="hidden"><div id="bossName"></div><div class="bar2"><i></i></div></div>
 <div id="prompt" class="hidden"></div>
 <div id="toast"></div>
 <div id="banner"><h2></h2><div></div></div>
 <div id="log"></div>
 <button class="btn red" id="potBtn">🧪 <span id="potN">0</span> (Q)</button>
 <div id="btns"><button class="btn alt" id="bBag">🎒 Bag (I)</button><button class="btn alt" id="bJour">📜 Journal (J)</button><button class="btn alt" id="bMap">🗺️ Map (M)</button><button class="btn alt" id="bMenu">☰</button></div>
 <div id="help">WASD: move · Shift: run · Space: jump · Click / F: attack · E: talk / pick up · Q: potion · Drag: camera</div>
</div>

<div id="touch" class="hidden"><div id="stick"><i></i></div><div id="tbtns"><button class="btn alt" id="tJump">Jump</button><button class="btn blue" id="tAct">Talk</button><button class="btn" id="tAtk">⚔️</button><button class="btn red" id="tPot">🧪</button></div></div>

<div id="dlg" class="hidden"></div>
<div id="modal" class="hidden"><div id="mbox"></div></div>
<div id="gpop" class="hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>

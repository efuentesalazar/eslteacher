    method: "POST", headers: { apikey: "sb_publishable_nGgOCuUUuXKK7gx957LYhg_Jf2V4TJC", "Content-Type": "application/json" },
    body: JSON.stringify({ p_token: s.token })
  }).then(function (r) { return r.json(); }).then(function (j) { go(j && j.ok ? j.code : null); }).catch(function () { go(); });
})();
</script>

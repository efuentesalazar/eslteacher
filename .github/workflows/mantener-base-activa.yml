# Supabase (plan gratuito) pausa la base de datos si pasa una semana sin uso.
# Esta tarea hace una llamada inofensiva dos veces por semana para que no se pause
# en vacaciones. Usa la clave pública del sitio (la misma de assets/js/portada/datos.js).
name: Mantener base de datos activa

on:
  schedule:
    - cron: "17 12 * * 1,4" # lunes y jueves
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a la base de datos
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 -X POST \
            "https://tlihbmgokuhvppbchvrz.supabase.co/rest/v1/rpc/eslt_logout" \
            -H "apikey: sb_publishable_nGgOCuUUuXKK7gx957LYhg_Jf2V4TJC" \
            -H "Content-Type: application/json" \
            -d '{"p_token":"00000000-0000-0000-0000-000000000000"}')
          echo "Respuesta: $code"
          test "$code" = "200"
